<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Launcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08081a;
      --card-bg: #13132b;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --glow: rgba(124, 58, 237, 0.6);
      --text: #f0f0ff;
      --muted: #6b6b9a;
      --select-border: 4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 75%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 55%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 85%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.35) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient glow orbs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 40% 30% at 15% 50%, rgba(124,58,237,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 85% 50%, rgba(6,182,212,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 32px 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a78bfa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .logo span {
      color: #f0f0ff;
      -webkit-text-fill-color: #f0f0ff;
    }

    .controls-hint {
      display: flex;
      gap: 20px;
      align-items: center;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .hint-btn {
      background: #1e1e3f;
      border: 1px solid #2d2d5a;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.75rem;
      color: #9090c0;
    }

    #game-info-bar {
      height: 48px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: opacity 0.3s;
    }

    #game-info-bar.hidden { opacity: 0; }

    #selected-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: #fff;
    }

    #selected-meta {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    #launch-hint {
      margin-left: auto;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.97); }
    }

    /* Games grid */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
      overflow-y: auto;
      flex: 1;
      padding: 8px 4px;
      scrollbar-width: none;
    }

    #grid::-webkit-scrollbar { display: none; }

    .game-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3/4;
      background: var(--card-bg);
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .game-card .card-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      z-index: 2;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .game-card .card-label .players {
      font-family: 'Nunito', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }

    /* Selected state */
    .game-card.selected {
      border-color: transparent;
      transform: scale(1.06) translateY(-4px);
      box-shadow:
        0 0 0 3px #7c3aed,
        0 0 30px rgba(124,58,237,0.5),
        0 20px 40px rgba(0,0,0,0.5);
    }

    .game-card.selected img {
      transform: scale(1.05);
    }

    .game-card.selected .card-label {
      color: #fff;
    }

    /* Corner badge for selected */
    .game-card.selected::after {
      content: '▶';
      position: absolute;
      top: 10px;
      right: 10px;
      background: #7c3aed;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      z-index: 3;
      box-shadow: 0 0 12px rgba(124,58,237,0.7);
      padding-left: 2px;
    }

    /* Placeholder cover for missing images */
    .game-card .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 3rem;
    }

    /* Loading state */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      background: linear-gradient(135deg, #a78bfa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e1e3f;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty state */
    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      color: var(--muted);
      text-align: center;
    }

    #empty .empty-icon { font-size: 4rem; }
    #empty h2 { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: var(--text); }
    #empty p { font-size: 0.9rem; max-width: 400px; line-height: 1.6; }
    #empty code { background: #1e1e3f; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; color: #a78bfa; }

    /* Gamepad indicator */
    #gamepad-status {
      position: fixed;
      bottom: 24px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      z-index: 10;
    }

    #gamepad-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3f3f6a;
      transition: background 0.3s;
    }

    #gamepad-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.5);
    }

    /* Card entrance animation */
    .game-card {
      animation: card-in 0.4s ease backwards;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loader-logo">🎮 GameVault</div>
  <div class="loader-spinner"></div>
</div>

<div id="app">
  <header>
    <div class="logo">🎮 Game<span>Vault</span></div>
    <div class="controls-hint">
      <span class="hint-btn">↑↓←→ Navigate</span>
      <span class="hint-btn">A / Enter Launch</span>
    </div>
  </header>

  <div id="game-info-bar" class="hidden">
    <div id="selected-title">—</div>
    <div id="selected-meta"></div>
    <div id="launch-hint">Press A to Play</div>
  </div>

  <div id="grid"></div>

  <div id="empty">
    <div class="empty-icon">📂</div>
    <h2>No Games Found</h2>
    <p>Edit <code>games.json</code> and add your game files to GitHub Releases, then update the URLs.</p>
  </div>
</div>

<div id="gamepad-status">
  <div id="gamepad-dot"></div>
  <span id="gamepad-label">No controller</span>
</div>

<script>
  // ─── State ───────────────────────────────────────────────
  let games = [];
  let selectedIndex = 0;
  let gamepadIndex = null;
  let gamepadPollId = null;
  let lastAxes = [];
  let lastButtons = [];

  // ─── Load Games ──────────────────────────────────────────
  async function loadGames() {
    try {
      const res = await fetch('games.json');
      const data = await res.json();
      games = data.games || [];
    } catch (e) {
      games = [];
    }
    renderGrid();
    hideLoading();
  }

  // ─── Render ───────────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    if (!games.length) {
      grid.style.display = 'none';
      empty.style.display = 'flex';
      document.getElementById('game-info-bar').classList.add('hidden');
      return;
    }

    grid.style.display = 'grid';
    empty.style.display = 'none';
    grid.innerHTML = '';

    games.forEach((game, i) => {
      const card = document.createElement('div');
      card.className = 'game-card' + (i === selectedIndex ? ' selected' : '');
      card.dataset.index = i;
      card.style.animationDelay = `${i * 0.05}s`;
      card.tabIndex = 0;

      // Color palettes per game for placeholder
      const colors = [
        ['#7c3aed','#06b6d4'], ['#ea580c','#facc15'],
        ['#16a34a','#06b6d4'], ['#db2777','#7c3aed'],
        ['#0284c7','#22c55e'], ['#b45309','#ef4444']
      ];
      const [c1, c2] = colors[i % colors.length];

      if (game.cover) {
        card.innerHTML = `
          <img src="${game.cover}" alt="${game.title}" 
               onerror="this.parentElement.innerHTML = makePlaceholder(${i}, '${game.title.replace(/'/g,"\\'")}', '${c1}', '${c2}')">
          <div class="card-label">
            ${game.title}
            <div class="players">${game.players ? `${game.players} Players` : ''}</div>
          </div>`;
      } else {
        card.innerHTML = `
          <div class="cover-placeholder" style="background: linear-gradient(135deg, ${c1}22, ${c2}22)">
            <span>${game.icon || '🎮'}</span>
          </div>
          <div class="card-label">
            ${game.title}
            <div class="players">${game.players ? `${game.players} Players` : ''}</div>
          </div>`;
      }

      card.addEventListener('click', () => { selectGame(i); launchGame(); });
      grid.appendChild(card);
    });

    updateInfoBar();
  }

  window.makePlaceholder = function(i, title, c1, c2) {
    const icons = ['🎮','🎳','🎵','⚽','🎯','🏆'];
    return `<div class="cover-placeholder" style="background: linear-gradient(135deg, ${c1}22, ${c2}22)">
      <span>${icons[i % icons.length]}</span>
    </div>
    <div class="card-label">${title}</div>`;
  };

  function selectGame(index) {
    const prev = document.querySelector('.game-card.selected');
    if (prev) prev.classList.remove('selected');
    selectedIndex = index;
    const next = document.querySelector(`.game-card[data-index="${index}"]`);
    if (next) {
      next.classList.add('selected');
      next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    updateInfoBar();
  }

  function updateInfoBar() {
    const bar = document.getElementById('game-info-bar');
    if (!games.length) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    const game = games[selectedIndex];
    document.getElementById('selected-title').textContent = game.title;
    document.getElementById('selected-meta').textContent =
      [game.players ? `${game.players} Players` : '', game.year || ''].filter(Boolean).join(' · ');
  }

  // ─── Launch ───────────────────────────────────────────────
  function launchGame() {
    if (!games.length) return;
    const game = games[selectedIndex];
    const params = new URLSearchParams({
      id: game.id,
      title: game.title,
      file: game.file,
      core: game.core || 'dolphin'
    });
    window.location.href = `emulator.html?${params.toString()}`;
  }

  // ─── Keyboard Navigation ─────────────────────────────────
  document.addEventListener('keydown', e => {
    const cols = getColumns();
    const len = games.length;
    if (!len) return;

    if (e.key === 'ArrowRight') { e.preventDefault(); selectGame((selectedIndex + 1) % len); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); selectGame((selectedIndex - 1 + len) % len); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); selectGame(Math.min(selectedIndex + cols, len - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selectGame(Math.max(selectedIndex - cols, 0)); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); launchGame(); }
  });

  function getColumns() {
    const grid = document.getElementById('grid');
    if (!grid || !grid.firstChild) return 4;
    const style = getComputedStyle(grid);
    return style.gridTemplateColumns.split(' ').length;
  }

  // ─── Gamepad / Wii Remote (via Gamepad API) ──────────────
  // Wii Remote connected via Bluetooth shows up as a standard gamepad
  // D-pad = buttons 12/13/14/15, A button = button 0 or 1
  window.addEventListener('gamepadconnected', e => {
    gamepadIndex = e.gamepad.index;
    document.getElementById('gamepad-dot').classList.add('connected');
    document.getElementById('gamepad-label').textContent = 'Controller connected';
    startGamepadPoll();
  });

  window.addEventListener('gamepaddisconnected', () => {
    gamepadIndex = null;
    document.getElementById('gamepad-dot').classList.remove('connected');
    document.getElementById('gamepad-label').textContent = 'No controller';
    if (gamepadPollId) cancelAnimationFrame(gamepadPollId);
  });

  function startGamepadPoll() {
    function poll() {
      const gp = navigator.getGamepads()[gamepadIndex];
      if (!gp) { gamepadPollId = requestAnimationFrame(poll); return; }

      const buttons = gp.buttons.map(b => b.pressed);
      const axes = gp.axes;
      const len = games.length;
      if (!len) { gamepadPollId = requestAnimationFrame(poll); return; }

      const cols = getColumns();

      // D-pad: up=12, down=13, left=14, right=15
      // Also support left stick (axes 0,1)
      const up    = (buttons[12] && !lastButtons[12]) || (axes[1] < -0.5 && (lastAxes[1] || 0) >= -0.5);
      const down  = (buttons[13] && !lastButtons[13]) || (axes[1] >  0.5 && (lastAxes[1] || 0) <=  0.5);
      const left  = (buttons[14] && !lastButtons[14]) || (axes[0] < -0.5 && (lastAxes[0] || 0) >= -0.5);
      const right = (buttons[15] && !lastButtons[15]) || (axes[0] >  0.5 && (lastAxes[0] || 0) <=  0.5);
      // A button = 0, B = 1 for most gamepads; Wii Remote A = 0
      const confirm = (buttons[0] && !lastButtons[0]) || (buttons[1] && !lastButtons[1]);

      if (right) selectGame((selectedIndex + 1) % len);
      else if (left) selectGame((selectedIndex - 1 + len) % len);
      else if (down) selectGame(Math.min(selectedIndex + cols, len - 1));
      else if (up) selectGame(Math.max(selectedIndex - cols, 0));
      if (confirm) launchGame();

      lastButtons = buttons;
      lastAxes = [...axes];
      gamepadPollId = requestAnimationFrame(poll);
    }
    gamepadPollId = requestAnimationFrame(poll);
  }

  // ─── Misc ─────────────────────────────────────────────────
  function hideLoading() {
    const el = document.getElementById('loading');
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), 500);
  }

  loadGames();
</script>
</body>
</html>
