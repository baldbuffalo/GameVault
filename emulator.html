<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing...</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #08081a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
      transition: opacity 0.6s ease;
    }

    #loading-screen.fade-out { opacity: 0; pointer-events: none; }

    .loading-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      background: linear-gradient(135deg, #a78bfa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-game-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: #fff;
    }

    .loading-spinner {
      width: 48px; height: 48px;
      border: 4px solid #1e1e3f;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-hint { font-size: 0.8rem; color: #6b6b9a; text-align: center; max-width: 400px; }

    .loading-progress {
      width: 280px;
      height: 4px;
      background: #1e1e3f;
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Error screen ── */
    #error-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #08081a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      text-align: center;
      padding: 32px;
    }

    #error-screen .error-icon { font-size: 4rem; }

    #error-screen h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      color: #ef4444;
    }

    #error-screen p { color: #6b6b9a; font-size: 0.95rem; max-width: 480px; line-height: 1.6; }

    #error-screen code {
      background: #1e1e3f;
      padding: 2px 8px;
      border-radius: 4px;
      color: #a78bfa;
      font-size: 0.85rem;
    }

    .back-btn {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      border: none;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .back-btn:hover { transform: scale(1.04); opacity: 0.9; }

    /* ── Back overlay ── */
    #back-overlay {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #back-overlay.visible { opacity: 1; pointer-events: all; }

    .back-pill {
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .back-pill:hover {
      background: rgba(124,58,237,0.6);
      border-color: rgba(124,58,237,0.5);
      color: #fff;
    }

    /* ── Game canvas ── */
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #game-canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-title">🎮 GameVault</div>
  <div class="loading-game-name" id="game-name-display">Loading...</div>
  <div class="loading-spinner"></div>
  <div class="loading-progress">
    <div class="loading-progress-bar" id="progress-bar"></div>
  </div>
  <div class="loading-hint" id="loading-hint">Loading Dolphin core...</div>
</div>

<div id="error-screen">
  <div class="error-icon">⚠️</div>
  <h2 id="error-title">Something went wrong</h2>
  <p id="error-message"></p>
  <button class="back-btn" onclick="goBack()">← Back to Games</button>
</div>

<div id="back-overlay">
  <div class="back-pill" onclick="goBack()">← Back to Games</div>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
</div>

<script>
  const params    = new URLSearchParams(window.location.search);
  const gameTitle = params.get('title') || 'Game';
  const gameFile  = params.get('file')  || '';

  document.title = `Playing ${gameTitle}`;
  document.getElementById('game-name-display').textContent = gameTitle;

  const DOLPHIN_BASE = 'dolphin-wasm/';

  // ── Entry point ────────────────────────────────────────────
  if (!gameFile) {
    showError('No Game File', 'No game file URL was provided. Go back and try again.');
  } else {
    checkCoreAndStart();
  }

  async function checkCoreAndStart() {
    // Check if WASM core exists in our repo
    try {
      const res = await fetch(DOLPHIN_BASE + 'dolphin.js', { method: 'HEAD' });
      if (!res.ok) throw new Error('not found');
      setHint('Core found — loading emulator...');
      setProgress(10);
      await loadDolphin();
    } catch {
      showError(
        'Dolphin Core Not Built Yet',
        'The Dolphin WASM core hasn\'t been compiled yet. ' +
        'Go to your GitHub repo → Actions → Run the "Build Dolphin WASM" workflow. ' +
        'Once it completes, come back and try again.'
      );
    }
  }

  // ── Load Dolphin WASM ──────────────────────────────────────
  async function loadDolphin() {
    // Configure the Dolphin module before the script loads
    window.Module = {
      canvas: document.getElementById('game-canvas'),

      // Called by emscripten as files download
      setStatus(text) {
        if (!text) return;
        setHint(text);
        // Parse emscripten progress messages like "Downloading data... (x/y)"
        const m = text.match(/\((\d+)\/(\d+)\)/);
        if (m) setProgress(10 + Math.round((parseInt(m[1]) / parseInt(m[2])) * 60));
      },

      onRuntimeInitialized() {
        setProgress(75);
        setHint('Core ready — loading game...');
        loadGame();
      },

      print(text)    { console.log('[Dolphin]', text); },
      printErr(text) { console.warn('[Dolphin]', text); },

      // Emscripten looks for this to find data files
      locateFile(path) {
        return DOLPHIN_BASE + path;
      }
    };

    // Inject the Dolphin JS glue
    const script = document.createElement('script');
    script.src = DOLPHIN_BASE + 'dolphin.js';
    script.onerror = () => showError(
      'Failed to Load Core',
      'dolphin.js failed to load. The build may be incomplete — check the GitHub Actions logs.'
    );
    document.body.appendChild(script);
  }

  // ── Load the game ROM ──────────────────────────────────────
  async function loadGame() {
    setHint(`Downloading ${gameTitle}...`);

    try {
      const res = await fetch(gameFile);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const total  = parseInt(res.headers.get('content-length') || '0');
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) setProgress(75 + Math.round((received / total) * 20));
      }

      const gameData = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        gameData.set(chunk, offset);
        offset += chunk.length;
      }

      setProgress(97);
      setHint('Starting game...');

      // Write the ROM into Dolphin's virtual filesystem
      const filename = '/game.rvz';
      Module.FS.writeFile(filename, gameData);

      // Boot it
      Module.dolphinBoot(filename);

      // Fade out loading screen
      setProgress(100);
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('fade-out');
        setTimeout(() => document.getElementById('loading-screen').remove(), 700);
        showBackButton();
      }, 400);

    } catch (err) {
      showError(
        'Failed to Load Game',
        `Could not download "${gameTitle}". Make sure the .rvz file is attached to your GitHub Release and the repo is public. (${err.message})`
      );
    }
  }

  // ── UI helpers ─────────────────────────────────────────────
  function setProgress(pct) {
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function setHint(text) {
    document.getElementById('loading-hint').textContent = text;
  }

  function goBack() { window.location.href = 'index.html'; }

  let backTimeout;
  function showBackButton() {
    const overlay = document.getElementById('back-overlay');
    const show = () => {
      overlay.classList.add('visible');
      clearTimeout(backTimeout);
      backTimeout = setTimeout(() => overlay.classList.remove('visible'), 3000);
    };
    show();
    document.addEventListener('mousemove', show);
  }

  function showError(title, message) {
    const ls = document.getElementById('loading-screen');
    ls.classList.add('fade-out');
    setTimeout(() => ls.remove(), 500);
    document.getElementById('error-title').textContent   = title;
    document.getElementById('error-message').textContent = message;
    document.getElementById('error-screen').style.display = 'flex';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Home') goBack(); });
</script>
</body>
</html>
