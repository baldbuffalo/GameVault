name: Build Dolphin WASM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dolphin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout GameVault
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build git python3 \
            libevdev-dev libudev-dev \
            libpulse-dev libgl1-mesa-dev \
            pkg-config

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Verify emcc
        run: emcc --version

      - name: Get latest Dolphin commit and release
        id: dolphin-version
        run: |
          SHA=$(git ls-remote https://github.com/dolphin-emu/dolphin.git HEAD | head -1 | cut -f1)
          RELEASE=$(curl -s https://api.github.com/repos/dolphin-emu/dolphin/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "$RELEASE" ]; then
            RELEASE="no-release"
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "Latest commit: $SHA"
          echo "Latest release: $RELEASE"

      - name: Cache Dolphin source
        uses: actions/cache@v5.0.4
        id: dolphin-cache
        with:
          path: .dolphin-src
          key: dolphin-src-${{ steps.dolphin-version.outputs.sha }}-${{ steps.dolphin-version.outputs.release }}

      - name: Clone Dolphin
        if: steps.dolphin-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .dolphin-src
          git clone --depth=1 https://github.com/dolphin-emu/dolphin.git .dolphin-src
          cd .dolphin-src
          git submodule update --init --recursive

      - name: Configure
        run: |
          mkdir -p .dolphin-src/build-wasm
          cd .dolphin-src/build-wasm

          EMCC_LINK_FLAGS="\
            -pthread \
            -s USE_PTHREADS=1 \
            -s PTHREAD_POOL_SIZE=8 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MAXIMUM_MEMORY=4294967296 \
            -s INITIAL_MEMORY=268435456 \
            -s FORCE_FILESYSTEM=1 \
            -s EXPORTED_FUNCTIONS=_main,_dolphinBoot \
            -s EXPORTED_RUNTIME_METHODS=FS,callMain \
            -s EXIT_RUNTIME=0 \
            -s WASM=1 \
            -s FULL_ES3=1 \
            -s USE_WEBGL2=1 \
            -s OFFSCREEN_FRAMEBUFFER=1 \
            -s OFFSCREENCANVAS_SUPPORT=1 \
            -s ASYNCIFY=1"

          emcmake cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="$EMCC_LINK_FLAGS" \
            -DCMAKE_CXX_FLAGS="-fexceptions -pthread" \
            -DCMAKE_C_FLAGS="-pthread" \
            -DENABLE_SDL=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_NOGUI=ON \
            -DUSE_SHARED_ENET=OFF \
            -DENABLE_ANALYTICS=OFF \
            -DENABLE_ALSA=OFF \
            -DENABLE_PULSEAUDIO=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_EGL=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_LLVM=OFF \
            2>&1 | tee cmake-output.log || true

          echo "--- CMake errors ---"
          grep -i "error\|could not" cmake-output.log | head -40 || true

      - name: Build
        run: |
          cd .dolphin-src/build-wasm
          emmake ninja 2>&1 | tee build-output.log || true
          echo "--- First 50 errors ---"
          grep "error:" build-output.log | head -50 || true

      - name: Upload build logs
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: build-logs
          path: |
            .dolphin-src/build-wasm/cmake-output.log
            .dolphin-src/build-wasm/build-output.log
          retention-days: 7

      - name: Debug build output
        if: always()
        run: |
          echo "--- Build dir contents ---"
          ls -lh .dolphin-src/build-wasm/ || echo "build-wasm dir missing"
          echo "--- Any .js files ---"
          find .dolphin-src/build-wasm -name "*.js" 2>/dev/null | head -20 || true
          echo "--- Any .wasm files ---"
          find .dolphin-src/build-wasm -name "*.wasm" 2>/dev/null | head -20 || true
          echo "--- Last 30 lines of build log ---"
          tail -30 .dolphin-src/build-wasm/build-output.log || true

      - name: Copy WASM output
        run: |
          mkdir -p dolphin-wasm
          FOUND=0
          for f in dolphin.js dolphin.wasm dolphin.data \
                    Dolphin.js Dolphin.wasm Dolphin.data \
                    dolphin-emu.js dolphin-emu.wasm dolphin-emu.data; do
            if [ -f ".dolphin-src/build-wasm/$f" ]; then
              cp ".dolphin-src/build-wasm/$f" dolphin-wasm/
              echo "✓ Copied $f"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 0 ]; then
            find .dolphin-src/build-wasm -maxdepth 2 \( -name "*.js" -o -name "*.wasm" -o -name "*.data" \) \
              ! -path "*/CMakeFiles/*" \
              -exec cp {} dolphin-wasm/ \; -exec echo "✓ Copied {}" \;
            FOUND=$(ls dolphin-wasm/ 2>/dev/null | wc -l)
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "❌ No WASM output files found — build failed"
            exit 1
          fi
          cd dolphin-wasm
          for f in *.js;   do [ "$f" != "dolphin.js"   ] && mv "$f" dolphin.js   && echo "→ renamed to dolphin.js";   done
          for f in *.wasm; do [ "$f" != "dolphin.wasm" ] && mv "$f" dolphin.wasm && echo "→ renamed to dolphin.wasm"; done
          for f in *.data; do [ "$f" != "dolphin.data" ] && mv "$f" dolphin.data && echo "→ renamed to dolphin.data"; done

      - name: Commit WASM files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dolphin-wasm/
          if git diff --staged --quiet; then
            echo "No new WASM files to commit"
          else
            git commit -m "build: add Dolphin WASM output [skip ci]"
            git push
          fi
